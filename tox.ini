[tox]
requires =
    tox>=4
env_list = py{39,310,311,312,313}, lint, ty, docs

[testenv]
description = run unit tests
extras = test
commands =
    pytest

[testenv:ty]
description = run ty
extras = typecheck
commands =
    ty check

[testenv:lint]
description = run Ruff checks
extras = lint
commands =
    ruff check .
    ruff format --check .

[testenv:docs]
description = build documentation
extras = docs
commands =
    rm -rf docs/_build
    sphinx-build -b html docs docs/_build/html
